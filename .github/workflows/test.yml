name: Test

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # macos-latest is still Xcode 26 and cannot compile ArrangementView (iOS 27.1).
    # Switch back once macos-latest ships Xcode 27.1 or later.
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install xcodegen
      - name: Test
        run: make test OS=latest
