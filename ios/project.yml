name: BARTist
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    MARKETING_VERSION: 1.1
    CURRENT_PROJECT_VERSION: 2
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  BARTist:
    type: application
    platform: iOS
    sources:
      - path: BARTist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bartist
        PRODUCT_NAME: BARTist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BARTist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  BARTistUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BARTistUITests
    dependencies:
      - target: BARTist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bartist.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BARTist
        CODE_SIGN_STYLE: Automatic
schemes:
  BARTist:
    build:
      targets:
        BARTist: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BARTistUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BARTistUITests:
    build:
      targets:
        BARTist: all
        BARTistUITests: [test]
    test:
      config: Debug
      targets:
        - BARTistUITests
