<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BARTist</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>BARTist</h1>
      <div id="spinner" class="spinner" hidden></div>
    </header>

    <main>
      <section id="trains-page" class="page">
        <button id="station-button" type="button">Select a station</button>
        <p id="status" class="status" hidden></p>
        <div id="departures" class="departures"></div>
      </section>

      <section id="map-page" class="page" hidden>
        <div id="map-viewport" class="map-viewport">
          <img
            id="map-image"
            src="assets/BART_cc_map.png"
            alt="BART system map"
          />
        </div>
      </section>
    </main>

    <nav class="tabs">
      <button type="button" class="tab active" data-tab="trains">Trains</button>
      <button type="button" class="tab" data-tab="map">Map</button>
    </nav>

    <div id="station-picker" class="picker" hidden>
      <div class="picker-header">
        <button id="picker-back" type="button">Back</button>
        <h2>Select a station</h2>
      </div>
      <ul id="station-list" class="station-list"></ul>
    </div>
  </body>
</html>
