  </defs>
  <rect width="512" height="512" rx="108" fill="url(#e-bg)"/>
  <!-- twin rails -->
  <rect x="96" y="330" width="320" height="28" rx="8" fill="#ffffff" opacity="0.92"/>
  <rect x="96" y="390" width="320" height="28" rx="8" fill="#ffffff" opacity="0.92"/>
